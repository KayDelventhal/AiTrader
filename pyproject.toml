[project]
name = "aitrader"
version = "0.1.0"
description = "Local-first trading research and simulation workbench"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.coverage.run]
source = ["backend/app"]

[tool.coverage.report]
show_missing = true
